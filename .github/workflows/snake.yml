name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1E4A3B&color_dots=#ebedf0,#cfe0d5,#8fb8a0,#3e7d5a,#1e4a3b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#cfe0d5&color_dots=#161b22,#1e3a2f,#2f5a3e,#4f8a68,#8fc3a4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
